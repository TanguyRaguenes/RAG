[project]
name = "rag-ihm"
version = "0.1.0"
description = "Interface Streamlit du RAG interne"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34.2",
    "streamlit>=1.57.0",
]

[dependency-groups]
dev = [
    "debugpy>=1.8.19",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.21",
]

[tool.coverage.run]
omit = [
    "app/main.py",
    "app/components/*.py",
    "app/pages/*.py",
]
