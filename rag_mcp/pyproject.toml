[project]
name = "rag-mcp"
version = "0.1.0"
description = "Serveur MCP exposant le RAG documentaire interne à Kilo Code"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.0.0",
    "httpx",
    "PyJWT[crypto]",
    "uvicorn",
]

[dependency-groups]
dev = [
    "debugpy",
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.coverage.run]
omit = [
    "app/server.py",
]
